name: staging-smoke

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: self-hosted runner label. 비우면 GitHub hosted runner를 사용합니다.
        required: false
        default: ubuntu-latest
      api_base_url:
        description: smoke API base URL. self-hosted runner에서는 http://shipmate-api:8080 사용 가능.
        required: false
        default: ''
      run_stack_check:
        description: self-hosted runner에서 로컬 스테이징 전체 점검 스크립트를 실행합니다.
        required: false
        default: 'false'
      staging_https_url:
        description: DNS 없는 HTTPS 확인용 Merchant URL. 비우면 repository secret을 사용합니다.
        required: false
        default: ''
      staging_api_health_url:
        description: DNS 없는 HTTPS 확인용 API health URL. 비우면 repository secret을 사용합니다.
        required: false
        default: ''
      staging_resolve_ip:
        description: staging host를 강제 매핑할 IP. 비우면 repository secret을 사용합니다.
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run local staging stack check
        if: ${{ inputs.run_stack_check == 'true' }}
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'http://shipmate-api:8080' }}
          STAGING_HTTPS_URL: ${{ inputs.staging_https_url || secrets.STAGING_HTTPS_URL }}
          API_HEALTH_URL: ${{ inputs.staging_api_health_url || secrets.STAGING_API_HEALTH_URL }}
          STAGING_RESOLVE_IP: ${{ inputs.staging_resolve_ip || secrets.STAGING_RESOLVE_IP }}
          ALLOW_INSECURE_TLS: ${{ secrets.STAGING_ALLOW_INSECURE_TLS || 'true' }}
        run: |
          bash shipmate-infra/scripts/check-staging-stack.sh

      - name: Check temporary HTTPS
        if: ${{ inputs.run_stack_check != 'true' }}
        env:
          STAGING_HTTPS_URL: ${{ inputs.staging_https_url || secrets.STAGING_HTTPS_URL }}
          API_HEALTH_URL: ${{ inputs.staging_api_health_url || secrets.STAGING_API_HEALTH_URL }}
          STAGING_RESOLVE_IP: ${{ inputs.staging_resolve_ip || secrets.STAGING_RESOLVE_IP }}
          ALLOW_INSECURE_TLS: ${{ secrets.STAGING_ALLOW_INSECURE_TLS || 'false' }}
        run: |
          if [[ -n "${STAGING_HTTPS_URL}" || -n "${API_HEALTH_URL}" || -n "${STAGING_RESOLVE_IP}" ]]; then
            bash shipmate-infra/scripts/check-staging-https.sh
          else
            mkdir -p shipmate-infra/reports/https
            cat > shipmate-infra/staging-https-report.json <<'REPORT'
          {"status":"skipped","reason":"STAGING_HTTPS_URL, STAGING_API_HEALTH_URL, STAGING_RESOLVE_IP secret이 없어 HTTPS 확인을 건너뜁니다."}
          REPORT
            cat > shipmate-infra/staging-https-report.xml <<'REPORT'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="shipmate-staging-https" tests="1" failures="0" errors="0" skipped="1">
            <testcase classname="shipmate.staging" name="DNS 없는 HTTPS 확인">
              <skipped message="HTTPS 확인 secret 없음" />
            </testcase>
          </testsuite>
          REPORT
            cp shipmate-infra/staging-https-report.json shipmate-infra/reports/https/staging-https-report-skipped.json
            cp shipmate-infra/staging-https-report.xml shipmate-infra/reports/https/staging-https-report-skipped.xml
          fi

      - name: Run staging smoke
        if: ${{ inputs.run_stack_check != 'true' }}
        env:
          API_BASE_URL: ${{ inputs.api_base_url || secrets.STAGING_API_BASE_URL }}
        run: |
          if [[ -n "${API_BASE_URL}" ]]; then
            bash shipmate-infra/scripts/smoke-staging.sh
          else
            mkdir -p shipmate-infra/reports/smoke
            cat > shipmate-infra/smoke-report.json <<'REPORT'
          {"status":"skipped","reason":"STAGING_API_BASE_URL secret이 없어 원격 runner smoke를 건너뜁니다. DNS 등록 전에는 self-hosted runner 또는 터널 URL secret을 사용하세요."}
          REPORT
            cat > shipmate-infra/smoke-report.xml <<'REPORT'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuite name="shipmate-staging-smoke" tests="1" failures="0" errors="0" skipped="1">
            <testcase classname="shipmate.staging" name="통합 시나리오">
              <skipped message="STAGING_API_BASE_URL secret 없음" />
            </testcase>
          </testsuite>
          REPORT
            cp shipmate-infra/smoke-report.json shipmate-infra/reports/smoke/smoke-report-skipped.json
            cp shipmate-infra/smoke-report.xml shipmate-infra/reports/smoke/smoke-report-skipped.xml
          fi

      - name: Summarize staging reports
        if: always()
        run: |
          if [[ -d /host-reports/github-runner ]]; then
            mkdir -p shipmate-infra/reports/github-runner
            cp -R /host-reports/github-runner/. shipmate-infra/reports/github-runner/
          fi
          if [[ -d /host-reports/cleanup ]]; then
            mkdir -p shipmate-infra/reports/cleanup
            cp -R /host-reports/cleanup/. shipmate-infra/reports/cleanup/
          fi
          bash shipmate-infra/scripts/summarize-staging-reports.sh

      - name: Upload smoke reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shipmate-smoke-reports
          path: |
            shipmate-infra/smoke-report.json
            shipmate-infra/smoke-report.xml
            shipmate-infra/reports/smoke/
            shipmate-infra/staging-https-report.json
            shipmate-infra/staging-https-report.xml
            shipmate-infra/reports/https/
            shipmate-infra/reports/github-runner/
            shipmate-infra/reports/cleanup/
            shipmate-infra/reports/staging-check-summary.md
            shipmate-infra/reports/staging-check-summary.html
