spring:
  datasource:
    url: jdbc:mysql://${SHIPMATE_MYSQL_HOST:mysql}:${SHIPMATE_MYSQL_PORT:3306}/${SHIPMATE_MYSQL_DATABASE:shipmate}?useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_0900_ai_ci&serverTimezone=Asia/Seoul
    username: ${SHIPMATE_MYSQL_USER:shipmate}
    password: ${SHIPMATE_MYSQL_PASSWORD:shipmate}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
