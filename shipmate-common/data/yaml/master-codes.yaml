document:
  title: "ShipMate Master Codes"
  repository: "shipmate-common"
  owner: "common"
  updated_at: "2026-05-24"
  rule: "Canonical shared master codes are stored in shipmate-common/data/yaml/master-codes.yaml."
  future_storage: "These master codes will later be generated into RDB tables."

rdb_generation_policy:
  source_of_truth: "data/yaml/master-codes.yaml"
  target: "RDB seed data and master code tables"
  recommended_tables:
    master_code_groups:
      purpose: "One row per code set."
      columns:
        - name: "code_group"
          type: "varchar"
          primary_key: true
          description: "Code set key such as upload_source."
        - name: "description"
          type: "varchar"
          primary_key: false
          description: "Code group description."
        - name: "active"
          type: "boolean"
          primary_key: false
          description: "Whether the code group is active."
        - name: "sort_order"
          type: "integer"
          primary_key: false
          description: "Display or export order."
    master_codes:
      purpose: "One row per code value."
      columns:
        - name: "code_group"
          type: "varchar"
          primary_key: true
          description: "Parent code set key."
        - name: "code"
          type: "varchar"
          primary_key: true
          description: "Code value."
        - name: "label_en"
          type: "varchar"
          primary_key: false
          description: "Default English label."
        - name: "active"
          type: "boolean"
          primary_key: false
          description: "Whether the code value is active."
        - name: "sort_order"
          type: "integer"
          primary_key: false
          description: "Display or export order."
  generation_rule:
    - "Do not hand-edit generated RDB seed data when YAML and generated output differ."
    - "Update this YAML first, then regenerate SQL or migration seed data."
    - "Use code set keys as stable identifiers."
    - "Do not rename existing code values after release; mark them inactive instead."

code_sets:
  upload_source:
    description: "Where a call recording upload came from."
    active: true
    sort_order: 10
    values:
      - code: "android_manual"
        label_en: "Android manual upload"
        active: true
        sort_order: 10
      - code: "android_share_intent"
        label_en: "Android share intent"
        active: true
        sort_order: 20
      - code: "android_auto"
        label_en: "Android automatic upload"
        active: false
        sort_order: 30

  call_recording_status:
    description: "Call recording upload and analysis status."
    active: true
    sort_order: 20
    values:
      - code: "CREATED"
        label_en: "Created"
        active: true
        sort_order: 10
      - code: "UPLOAD_URL_ISSUED"
        label_en: "Upload URL issued"
        active: true
        sort_order: 20
      - code: "UPLOADING"
        label_en: "Uploading"
        active: true
        sort_order: 30
      - code: "UPLOADED"
        label_en: "Uploaded"
        active: true
        sort_order: 40
      - code: "ANALYZING"
        label_en: "Analyzing"
        active: true
        sort_order: 50
      - code: "ANALYSIS_DONE"
        label_en: "Analysis done"
        active: true
        sort_order: 60
      - code: "FAILED"
        label_en: "Failed"
        active: true
        sort_order: 90

  consent_type:
    description: "User consent categories."
    active: true
    sort_order: 30
    values:
      - code: "audio_upload_analysis"
        label_en: "Audio upload and AI analysis"
        active: true
        sort_order: 10
      - code: "auto_upload"
        label_en: "Automatic upload"
        active: false
        sort_order: 20
