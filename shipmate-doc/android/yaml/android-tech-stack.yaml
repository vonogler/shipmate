document:
  title: "ShipMate Android Technology Stack"
  service_name_en: "ShipMate AI"
  repository: "shipmate-android"
  decision_date: "2026-05-24"
  doc_location_rule: "Android documentation belongs under shipmate-doc/android/."

scope:
  current_priority: "Call recording upload only"
  postponed:
    - "Shipment sheet screens"
    - "Full OMS/ERP workflow"
    - "Automatic call recording detection"

android_stack:
  language: "Kotlin"
  ui: "Jetpack Compose"
  design_system: "Material 3"
  architecture: "MVVM"
  state_management: "ViewModel + StateFlow"
  async: "Kotlin Coroutines"
  background_jobs: "WorkManager"
  network: "Retrofit + OkHttp"
  local_settings: "Jetpack DataStore"
  local_database: "Room"
  dependency_injection: "Hilt"
  navigation: "Navigation Compose"
  logging: "Timber"
  build_system: "Gradle Kotlin DSL"

sdk_policy:
  min_sdk: 26
  target_sdk: 36
  compile_sdk: 36
  reason:
    - "Android 8.0+ keeps the practical device range broad enough for small business users."
    - "API 36 is the selected current Android SDK target for the app."
    - "The project can move to a newer compile/target SDK after local SDK availability is confirmed."

upload_strategy:
  primary: "Presigned URL Direct Upload to MinIO"
  flow:
    - "Android asks the API server to create an upload session."
    - "API server validates user authentication, upload consent, file size, and content type."
    - "API server creates metadata and returns a MinIO presigned PUT URL."
    - "Android uploads the audio file directly to MinIO."
    - "Android calls the API server complete endpoint."
    - "API server verifies the MinIO object and registers an analysis job."
  future_extension:
    - "S3-compatible multipart upload for large files."
    - "WorkManager retry for mobile network instability."

initial_screen:
  route: "/call-upload"
  component: "CallUploadScreen"
  required_elements:
    - "Upload and AI analysis consent checkbox"
    - "Audio file picker"
    - "Upload button"
    - "Upload progress"
    - "Recent upload list"
    - "Analysis status display"

api_contract:
  create_upload_session:
    method: "POST"
    path: "/api/call-recordings/upload-sessions"
  complete_upload:
    method: "POST"
    path: "/api/call-recordings/{recordingId}/complete"
  recent_uploads:
    method: "GET"
    path: "/api/call-recordings/recent"
