services:
  minio:
    image: minio/minio:latest
    container_name: shipmate-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${SHIPMATE_MINIO_ROOT_USER:-shipmate}
      MINIO_ROOT_PASSWORD: ${SHIPMATE_MINIO_ROOT_PASSWORD:-shipmate-local-password}
    volumes:
      - shipmate_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: shipmate-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${SHIPMATE_MINIO_ROOT_USER:-shipmate}
      MINIO_ROOT_PASSWORD: ${SHIPMATE_MINIO_ROOT_PASSWORD:-shipmate-local-password}
      MINIO_BUCKET: ${SHIPMATE_MINIO_BUCKET:-shipmate-call-recordings}
    entrypoint: >
      /bin/sh -c "
      until mc alias set shipmate-local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing shipmate-local/$$MINIO_BUCKET;
      mc anonymous set none shipmate-local/$$MINIO_BUCKET;
      "

  postgres:
    image: postgres:17-alpine
    container_name: shipmate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${SHIPMATE_POSTGRES_DB:-shipmate}
      POSTGRES_USER: ${SHIPMATE_POSTGRES_USER:-shipmate}
      POSTGRES_PASSWORD: ${SHIPMATE_POSTGRES_PASSWORD:-shipmate-local-password}
    volumes:
      - shipmate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SHIPMATE_POSTGRES_USER:-shipmate} -d ${SHIPMATE_POSTGRES_DB:-shipmate}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  shipmate_minio_data:
  shipmate_postgres_data:
