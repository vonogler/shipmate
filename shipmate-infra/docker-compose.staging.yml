name: shipmate-staging

services:
  mysql:
    image: mysql:8.4
    container_name: shipmate-staging-mysql
    ports:
      - "${SHIPMATE_STAGING_MYSQL_HOST_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${SHIPMATE_MYSQL_ROOT_PASSWORD:-shipmate}
      MYSQL_DATABASE: ${SHIPMATE_MYSQL_DATABASE:-shipmate}
      MYSQL_USER: ${SHIPMATE_MYSQL_USER:-shipmate}
      MYSQL_PASSWORD: ${SHIPMATE_MYSQL_PASSWORD:-shipmate}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - shipmate_staging_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u${SHIPMATE_MYSQL_USER:-shipmate} -p${SHIPMATE_MYSQL_PASSWORD:-shipmate} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    container_name: shipmate-staging-minio
    command: server /data --console-address ":9001"
    ports:
      - "${SHIPMATE_STAGING_MINIO_API_HOST_PORT:-19000}:9000"
      - "${SHIPMATE_STAGING_MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${SHIPMATE_MINIO_ROOT_USER:-shipmate}
      MINIO_ROOT_PASSWORD: ${SHIPMATE_MINIO_ROOT_PASSWORD:-shipmate}
    volumes:
      - shipmate_staging_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: shipmate-staging-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${SHIPMATE_MINIO_ROOT_USER:-shipmate}
      MINIO_ROOT_PASSWORD: ${SHIPMATE_MINIO_ROOT_PASSWORD:-shipmate}
      MINIO_BUCKET: ${SHIPMATE_MINIO_BUCKET:-shipmate-call-recordings}
    entrypoint: >
      /bin/sh -c "
      until mc alias set shipmate-staging http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      mc mb --ignore-existing shipmate-staging/$$MINIO_BUCKET;
      mc anonymous set none shipmate-staging/$$MINIO_BUCKET;
      "

  shipmate-api:
    build:
      context: ..
      dockerfile: shipmate-api/Dockerfile
    container_name: shipmate-staging-api
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${SHIPMATE_STAGING_API_HOST_PORT:-18080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SHIPMATE_MYSQL_HOST: mysql
      SHIPMATE_MYSQL_PORT: 3306
      SHIPMATE_MYSQL_DATABASE: ${SHIPMATE_MYSQL_DATABASE:-shipmate}
      SHIPMATE_MYSQL_USER: ${SHIPMATE_MYSQL_USER:-shipmate}
      SHIPMATE_MYSQL_PASSWORD: ${SHIPMATE_MYSQL_PASSWORD:-shipmate}
      SHIPMATE_MINIO_ENDPOINT: http://minio:9000
      SHIPMATE_MINIO_PUBLIC_ENDPOINT: http://localhost:19000
      SHIPMATE_MINIO_ACCESS_KEY: ${SHIPMATE_MINIO_ROOT_USER:-shipmate}
      SHIPMATE_MINIO_SECRET_KEY: ${SHIPMATE_MINIO_ROOT_PASSWORD:-shipmate}
      SHIPMATE_MINIO_BUCKET: ${SHIPMATE_MINIO_BUCKET:-shipmate-call-recordings}
      SHIPMATE_EMAIL_ATTACHMENT_RETENTION_DAYS: ${SHIPMATE_EMAIL_ATTACHMENT_RETENTION_DAYS:-365}
      SHIPMATE_CORS_ALLOWED_ORIGINS: https://${SHIPMATE_STAGING_DOMAIN:-staging-shipmate.com},http://localhost:13000,http://localhost:13001
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${STAGING_GOOGLE_OAUTH_REDIRECT_URI:-https://${SHIPMATE_STAGING_DOMAIN:-staging-shipmate.com}/api/oauth/google/callback}
      GOOGLE_GMAIL_POLLING_ENABLED: ${GOOGLE_GMAIL_POLLING_ENABLED:-true}
      GOOGLE_GMAIL_POLLING_DELAY_MS: ${GOOGLE_GMAIL_POLLING_DELAY_MS:-300000}
      GOOGLE_GMAIL_POLLING_MAX_MESSAGES: ${GOOGLE_GMAIL_POLLING_MAX_MESSAGES:-10}
      GOOGLE_GMAIL_AUTO_CREATE_ORDER_DRAFTS: ${GOOGLE_GMAIL_AUTO_CREATE_ORDER_DRAFTS:-true}
      GOOGLE_OAUTH_TOKEN_ENCRYPTION_SECRET: ${GOOGLE_OAUTH_TOKEN_ENCRYPTION_SECRET:-change-this-staging-google-oauth-token-key}
    volumes:
      - shipmate_staging_api_data:/workspace/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  shipmate-merchant:
    build:
      context: ..
      dockerfile: shipmate-merchant/Dockerfile
      args:
        VITE_SHIPMATE_API_BASE_URL: ""
        VITE_BASE_PATH: /merchant/
    container_name: shipmate-staging-merchant
    depends_on:
      shipmate-api:
        condition: service_healthy
    ports:
      - "${SHIPMATE_STAGING_MERCHANT_HOST_PORT:-13001}:80"

  shipmate-admin:
    build:
      context: ..
      dockerfile: shipmate-admin/Dockerfile
      args:
        VITE_SHIPMATE_API_BASE_URL: ""
        VITE_BASE_PATH: /admin/
    container_name: shipmate-staging-admin
    depends_on:
      shipmate-api:
        condition: service_healthy
    ports:
      - "${SHIPMATE_STAGING_ADMIN_HOST_PORT:-13000}:80"

  nginx:
    image: nginx:1.29-alpine
    container_name: shipmate-staging-nginx
    depends_on:
      shipmate-api:
        condition: service_healthy
      shipmate-merchant:
        condition: service_started
      shipmate-admin:
        condition: service_started
    ports:
      - "${SHIPMATE_STAGING_HTTP_HOST_PORT:-80}:80"
      - "${SHIPMATE_STAGING_HTTPS_HOST_PORT:-443}:443"
    volumes:
      - ./nginx/staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/staging:/etc/nginx/certs:ro

volumes:
  shipmate_staging_mysql_data:
  shipmate_staging_minio_data:
  shipmate_staging_api_data:
